apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# No `namespace:` here on purpose — the overlay (infra/k8s/overlays/prod) sets it, so this
# base stays reusable across environments.

labels:
  - includeSelectors: true
    pairs:
      app.kubernetes.io/part-of: erp

resources:
  - namespace.yaml
  - serviceaccount.yaml
  - configmap.yaml
  - api-deployment.yaml
  - worker-deployment.yaml
  - api-service.yaml
  - web-deployment.yaml
  - web-service.yaml
  - postgres-statefulset.yaml
  - redis-statefulset.yaml
  - minio-statefulset.yaml
  - pdb.yaml
