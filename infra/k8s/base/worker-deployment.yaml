# Same image as erp-api, running in the "worker" role: BullMQ job processing only (no HTTP
# server traffic — no Service selects these pods, see erp-api-service.yaml's comment).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: erp-worker
  namespace: erp
  labels:
    app.kubernetes.io/component: app
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: erp-worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: erp-worker
    spec:
      serviceAccountName: erp-app
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      # BullMQ waits for the active job to finish before exiting — payroll runs and PDF
      # renders take minutes, so this is much longer than erp-api's grace period.
      terminationGracePeriodSeconds: 120
      containers:
        # Same image as erp-api, but named for its role so `kubectl logs deploy/erp-worker`
        # and `describe` output read unambiguously.
        - name: erp-worker
          image: ghcr.io/OWNER/erp-api:latest
          ports:
            - containerPort: 3000
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          env:
            - name: APP_ROLE
              value: "worker"
          envFrom:
            - configMapRef:
                name: erp-config
            - secretRef:
                name: erp-secrets
          # Same Nest app as erp-api, so the health endpoint still works here — but with no
          # Service selecting erp-worker pods, these probes only gate kubelet
          # restart/readiness bookkeeping, never user traffic.
          startupProbe:
            httpGet:
              path: /api/v1/health
              port: 3000
            periodSeconds: 5
            failureThreshold: 12
          readinessProbe:
            httpGet:
              path: /api/v1/health
              port: 3000
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /api/v1/health
              port: 3000
            periodSeconds: 15
            failureThreshold: 3
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: "2"
              memory: 2Gi
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: dshm
              mountPath: /dev/shm
      volumes:
        # readOnlyRootFilesystem requires an explicit writable /tmp.
        - name: tmp
          emptyDir: {}
        # Larger than erp-api's: this is where Chromium PDF rendering actually happens
        # (payroll/report jobs), not just an occasional health-check-adjacent render.
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: 1Gi
