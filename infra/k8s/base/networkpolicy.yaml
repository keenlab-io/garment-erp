# Ingress isolation for the erp namespace.
#
# Without these, any pod anywhere in the cluster can open a TCP connection straight to
# erp-postgres:5432, erp-redis:6379 or erp-minio:9000 — the DATABASE_URL password is the only
# thing in the way. That is the gap these close. Encryption does not help here; only access
# control does.
#
# Ingress only, deliberately. Restricting egress would add real risk (a missed dependency
# fails silently at runtime, not at deploy time) for little gain against the stated threat,
# and it matches the house pattern in the chatbot-prod namespace.
#
# Selection is by `app.kubernetes.io/name`, which is already on every pod. The house style
# elsewhere selects on `app.kubernetes.io/component`, but that label lives on our object
# metadata rather than the pod templates — adding it to a pod template would change the
# template hash and force a rolling restart of Postgres for a purely cosmetic gain.
#
# ---------------------------------------------------------------------------------------
# WHAT IS DELIBERATELY MISSING, AND WHY
#
# There is no `default-deny-ingress` and no policy admitting the Tailscale proxy to erp-web.
# Both existed briefly and took the site down twice: with default-deny in force, traffic from
# the operator's proxy pod to erp-web was dropped, so garment-erp.keenlab.io returned 502 and
# later 504, and the tailnet address timed out.
#
# The cause is label injection by kustomize — confirmed 2026-08-29, not a guess. The base
# sets
#
#     labels:
#       - includeSelectors: true
#         pairs:
#           app.kubernetes.io/part-of: erp
#
# and `includeSelectors: true` rewrites EVERY selector it can reach, including the
# `ingress.from[].podSelector` of a NetworkPolicy. The rule authored here as
#
#     podSelector:
#       matchLabels:
#         tailscale.com/parent-resource: erp-web
#         tailscale.com/parent-resource-ns: erp
#
# therefore reached the cluster carrying a third requirement — `app.kubernetes.io/part-of:
# erp` — on the SOURCE pod. The Tailscale proxy pod is created by the operator, not by this
# kustomization, so it never has that label. matchLabels is an AND, so the selector matched
# zero pods, the allow rule admitted nothing, and default-deny dropped everything.
#
# The two policies below survived the same injection because their sources ARE managed here:
# erp-web pods do carry `app.kubernetes.io/part-of: erp`. That asymmetry is the whole story,
# and it is why those two looked "known-good" while the proxy rule never worked at all.
#
# An earlier version of this note guessed that the tailnet client IP (100.64.0.0/10) was
# preserved and that a podSelector therefore could not match the source. That was wrong. A
# podSelector is the right tool; it simply must not demand a label the operator's pod cannot
# have. Do not spend time chasing an `ipBlock` rule on the strength of that guess.
#
# To re-add a default-deny safely:
#   1. Keep the proxy rule out of the label transformer's reach, or select only on
#      `tailscale.com/*` labels — then verify against the RENDERED output, not the source:
#      `kubectl kustomize infra/k8s/overlays/prod` must show a from-selector with no
#      `app.kubernetes.io/part-of` in it.
#   2. Confirm the selector matches a real pod:
#      `kubectl get pod -n tailscale -l tailscale.com/parent-resource=erp-web --show-labels`
#   3. Test the real browser path (https://garment-erp.keenlab.io). The deploy's smoke test
#      runs `wget` INSIDE the web pod against 127.0.0.1, so it exercises web -> api and says
#      nothing about proxy -> web. A green deploy is not evidence that ingress works.
#
# Deleting a policy from this file is also not enough on its own. The deploy applies with
# `kubectl kustomize . | kubectl apply -f -` and does not prune, so an object already in the
# cluster outlives its removal from the base and has to be deleted explicitly. That is why
# these two kept dropping traffic for 13 days after the commit that removed them here.
# ---------------------------------------------------------------------------------------
---
# nginx in the web pod reverse-proxies /api and /socket.io to the erp-api Service. Nothing
# else should reach the API directly — external traffic arrives through erp-web.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-api-from-web
  namespace: erp
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: erp-api
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: erp-web
      ports:
        - protocol: TCP
          port: 3000
---
# Postgres, Redis and MinIO accept connections only from the app tier in this namespace.
#
# `erp-migrate` is included because the migration Job runs before any app pod and must reach
# Postgres. `erp-admin` is a deliberate escape hatch for one-off tooling — run ad-hoc pods
# (the `mc` bucket bootstrap, a psql shell) with `app.kubernetes.io/name=erp-admin` and they
# will be admitted; otherwise they are denied like anything else.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-datastores-from-app-tier
  namespace: erp
spec:
  podSelector:
    matchExpressions:
      - key: app.kubernetes.io/name
        operator: In
        values:
          - erp-postgres
          - erp-redis
          - erp-minio
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchExpressions:
              - key: app.kubernetes.io/name
                operator: In
                values:
                  - erp-api
                  - erp-worker
                  - erp-migrate
                  - erp-admin
      ports:
        - protocol: TCP
          port: 5432
        - protocol: TCP
          port: 6379
        - protocol: TCP
          port: 9000
