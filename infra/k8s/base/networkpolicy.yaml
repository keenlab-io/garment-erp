# Ingress isolation for the erp namespace.
#
# Without these, any pod anywhere in the cluster can open a TCP connection straight to
# erp-postgres:5432, erp-redis:6379 or erp-minio:9000 — the DATABASE_URL password is the only
# thing in the way. That is the gap these close. Encryption does not help here; only access
# control does.
#
# Ingress only, deliberately. Restricting egress would add real risk (a missed dependency
# fails silently at runtime, not at deploy time) for little gain against the stated threat,
# and it matches the house pattern in the chatbot-prod namespace.
#
# Selection is by `app.kubernetes.io/name`, which is already on every pod. The house style
# elsewhere selects on `app.kubernetes.io/component`, but that label lives on our object
# metadata rather than the pod templates — adding it to a pod template would change the
# template hash and force a rolling restart of Postgres for a purely cosmetic gain.
#
# ---------------------------------------------------------------------------------------
# WHAT IS DELIBERATELY MISSING, AND WHY
#
# There is no `default-deny-ingress` and no policy admitting the Tailscale proxy to erp-web.
# Both existed briefly and took the site down: with default-deny in force, traffic from the
# operator's proxy pod to erp-web was dropped, so garment-erp.keenlab.io returned 502 and the
# tailnet address timed out. The proxy pod's own labels did not match the `podSelector` that
# was meant to admit it, which suggests the traffic does not arrive with that pod as its
# source — most likely the original tailnet client IP (100.64.0.0/10) is preserved, and a
# podSelector can never match a source that is not a pod.
#
# That is a hypothesis, not a finding. Before re-adding a default-deny, capture the actual
# source address of proxy traffic arriving at an erp-web pod and write the rule against it —
# an `ipBlock` for the tailnet CGNAT range if the hypothesis holds.
#
# Whatever the rule, test the real browser path (https://garment-erp.keenlab.io) before
# trusting it. The deploy's smoke test runs `wget` INSIDE the web pod against 127.0.0.1, so
# it exercises web -> api and proves nothing about proxy -> web. A green deploy is not
# evidence that ingress works.
#
# The two policies below are known-good: they were live throughout a fully working site and
# carry the protection that actually mattered (nothing outside this namespace can reach the
# datastores).
# ---------------------------------------------------------------------------------------
---
# nginx in the web pod reverse-proxies /api and /socket.io to the erp-api Service. Nothing
# else should reach the API directly — external traffic arrives through erp-web.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-api-from-web
  namespace: erp
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: erp-api
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: erp-web
      ports:
        - protocol: TCP
          port: 3000
---
# Postgres, Redis and MinIO accept connections only from the app tier in this namespace.
#
# `erp-migrate` is included because the migration Job runs before any app pod and must reach
# Postgres. `erp-admin` is a deliberate escape hatch for one-off tooling — run ad-hoc pods
# (the `mc` bucket bootstrap, a psql shell) with `app.kubernetes.io/name=erp-admin` and they
# will be admitted; otherwise they are denied like anything else.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-datastores-from-app-tier
  namespace: erp
spec:
  podSelector:
    matchExpressions:
      - key: app.kubernetes.io/name
        operator: In
        values:
          - erp-postgres
          - erp-redis
          - erp-minio
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchExpressions:
              - key: app.kubernetes.io/name
                operator: In
                values:
                  - erp-api
                  - erp-worker
                  - erp-migrate
                  - erp-admin
      ports:
        - protocol: TCP
          port: 5432
        - protocol: TCP
          port: 6379
        - protocol: TCP
          port: 9000
