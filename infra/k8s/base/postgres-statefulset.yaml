# postgres:16, not -alpine (unlike infra/docker-compose.yml's dev image): glibc gives
# stable locale/collation behavior, which matters for a production database.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: erp-postgres
  namespace: erp
  # Marks this as data tier, not app tier. The deploy workflow selects on it to bring the
  # database up before the migration Job runs — see the "Bootstrap data tier" step. Object
  # metadata only: adding it to the pod template would change the (immutable) selector.
  labels:
    app.kubernetes.io/component: data
spec:
  serviceName: erp-postgres
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: erp-postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: erp-postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_USER
              value: erp
            - name: POSTGRES_DB
              value: erp
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: erp-secrets
                  key: POSTGRES_PASSWORD
            # Subdirectory, not the volume root: the mounted PVC root may contain a
            # lost+found directory, which initdb refuses to run against.
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "erp"]
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "erp"]
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: "2"
              memory: 2Gi
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 20Gi
---
apiVersion: v1
kind: Service
metadata:
  name: erp-postgres
  namespace: erp
  labels:
    app.kubernetes.io/component: data
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: erp-postgres
  ports:
    - port: 5432
