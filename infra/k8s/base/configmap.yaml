# Non-secret env only. Every other env var has a safe default in
# apps/api/src/config/env.schema.ts — add a key here only when overriding that default.
# APP_ROLE is NOT here: it selects the api/worker role and is set per-Deployment.
apiVersion: v1
kind: ConfigMap
metadata:
  name: erp-config
  namespace: erp
data:
  NODE_ENV: "production"
  # Multi-tenant SaaS: the tenant is resolved from the Host header via `tenant_domain`, and the
  # platform control plane (/platform), subscription billing and the public demo are on. Login
  # does not fall back to the default tenant for an unmapped host (M7 task 7.9), so the deploy
  # workflow's "Map the production hostname" step maps PUBLIC_HOST before any pod rolls. New
  # tenants get their hostname from `POST /platform/tenants` (its `domain` field).
  DEPLOYMENT_MODE: "cloud"
  # The demo pool hostname (M10 D3). Read only by the seed, which creates the DEMO_TEMPLATE
  # tenant and its DEMO_POOL `tenant_domain` row — see "Cloud go-live" in infra/k8s/README.md.
  DEMO_HOST: "garment-erp-demo.keenlab.io"
  # Nginx Proxy Manager and the in-pod nginx each append to X-Forwarded-For (the Tailscale
  # proxy between them is L4 and adds nothing), so the client is two hops back.
  TRUST_PROXY_HOPS: "2"
  S3_ENDPOINT: "http://erp-minio:9000"
  S3_BUCKET: "erp"
  S3_FORCE_PATH_STYLE: "true"
  S3_REGION: "us-east-1"
  SMTP_HOST: "localhost"
  SMTP_PORT: "1025"
  SMTP_FROM: "reports@erp.local"
