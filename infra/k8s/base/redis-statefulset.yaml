apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: erp-redis
  namespace: erp
  labels:
    app.kubernetes.io/component: data
spec:
  serviceName: erp-redis
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: erp-redis
  template:
    metadata:
      labels:
        app.kubernetes.io/name: erp-redis
    spec:
      containers:
        - name: redis
          image: redis:7
          ports:
            - containerPort: 6379
          # REQUIRED: BullMQ queues and job schedulers live entirely in Redis. Without AOF
          # persistence, a pod restart silently drops queued payroll/report jobs — this is
          # not an optional durability tweak.
          args: ["--appendonly", "yes"]
          volumeMounts:
            - name: data
              mountPath: /data
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
          livenessProbe:
            exec:
              command: ["redis-cli", "ping"]
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 2Gi
---
apiVersion: v1
kind: Service
metadata:
  name: erp-redis
  namespace: erp
  labels:
    app.kubernetes.io/component: data
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: erp-redis
  ports:
    - port: 6379
