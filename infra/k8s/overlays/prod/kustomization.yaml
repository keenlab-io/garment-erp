# This is the only overlay today. A future `staging` overlay would be a copy of this
# directory with a different namespace, a different tailscale hostname, and different
# replica counts (via a replicas: patch) — nothing in `base` should need to change for it.

apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: erp

resources:
  - ../../base

images:
  # Placeholders — the deploy workflow overwrites these with real digests via
  # `kustomize edit set image` at deploy time.
  - name: ghcr.io/OWNER/erp-api
    newTag: latest
  - name: ghcr.io/OWNER/erp-web
    newTag: latest

# The Tailscale operator creates a proxy that joins the tailnet as
# `garment-erp.tail0b8c39.ts.net`; Nginx Proxy Manager (external, outside this cluster)
# points its proxy host at `http://garment-erp.tail0b8c39.ts.net:80`.
#
# VERIFIED 2026-08-08 against operator v1.80.3 on the RDC cluster: applying this exact
# annotation pair to a throwaway ClusterIP Service created the proxy in ~6s, set the
# Service condition `TailscaleProxyReady=True`, registered the device under the *annotated*
# hostname (not the default `<ns>-<svc>` naming), and served HTTP 200 on :80 over the
# tailnet. Deleting the Service removed both the proxy and the tailnet device.
#
# Note: every other tailnet-exposed Service in this cluster uses the alternative
# `type: LoadBalancer` + `spec.loadBalancerClass: tailscale` form. Both work; this one is
# kept because it leaves the Service ClusterIP (no MetalLB address consumed).
patches:
  - target:
      kind: Service
      name: erp-web
    patch: |-
      apiVersion: v1
      kind: Service
      metadata:
        name: erp-web
        annotations:
          tailscale.com/expose: "true"
          tailscale.com/hostname: "garment-erp"
