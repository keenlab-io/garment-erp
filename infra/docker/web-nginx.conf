# Why this file proxies /api and /socket.io to the erp-api Service:
#
# `apps/web/src/api/client.ts` configures the typed ts-rest client with `baseUrl: ""`,
# and `realtime-client.ts` connects with a bare `io()` call — both assume the API is
# same-origin, reachable at `/api/v1` and `/socket.io` off whatever host is serving the
# SPA. Proxying both paths here to the erp-api Service means the whole app is exposed
# through exactly one Tailscale-exposed Service and one Nginx Proxy Manager host, with
# no CORS configuration needed anywhere. This mirrors the dev proxy in
# `apps/web/vite.config.ts`, which forwards the same two paths to localhost:3000
# (with `ws: true` for the /socket.io upgrade) during local development.

# Preserve the caller's X-Forwarded-Proto instead of overwriting it.
#
# This pod is always reached over plain HTTP — Nginx Proxy Manager terminates public TLS and
# forwards to the Tailscale proxy on :80 — so `$scheme` here is *always* "http", even when the
# browser is on HTTPS. Passing `$scheme` straight through therefore tells the API every request
# arrived unencrypted, discarding the `https` that NPM actually sent.
#
# Nothing reads the header today (the API is header-token auth, no cookies), so this is latent
# rather than broken. It stops being latent the moment anyone adds `secure` cookies, absolute
# URL generation, or a redirect-to-HTTPS guard — and it fails in the confusing direction, with
# the app insisting it is on HTTP while the browser shows a padlock.
#
# `map` must live at http{} level; this file is included from inside nginx's http block.
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;  # trust what the edge proxy sent
    ""      $scheme;                  # direct hit with no upstream header: use our own scheme
}

server {
    listen 8080;

    root /usr/share/nginx/html;

    # Allow larger request bodies through for uploads.
    client_max_body_size 25m;

    # SPA fallback: unknown paths resolve to index.html so client-side routing works.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # index.html must never be cached, or clients can pin to a stale asset manifest
    # (referencing content-hashed asset filenames that no longer exist after a deploy).
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Vite emits content-hashed filenames under /assets/, so these are safe to cache
    # forever — a new deploy always ships new filenames.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location /api/ {
        # CAVEAT: nginx resolves erp-api.erp.svc.cluster.local once at startup and
        # caches the ClusterIP. That's fine for the Service's lifetime, but if the
        # erp-api Service is ever deleted and recreated, the erp-web pods must be
        # restarted to pick up the new address.
        proxy_pass http://erp-api.erp.svc.cluster.local:3000;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;

        # PDF/Excel exports stream large bodies; buffering them to disk would be
        # pointless and the container has a read-only root filesystem.
        proxy_buffering off;

        # nginx's 60s default kills long report/PDF generations.
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location /socket.io/ {
        # CAVEAT: nginx resolves erp-api.erp.svc.cluster.local once at startup and
        # caches the ClusterIP. That's fine for the Service's lifetime, but if the
        # erp-api Service is ever deleted and recreated, the erp-web pods must be
        # restarted to pick up the new address.
        proxy_pass http://erp-api.erp.svc.cluster.local:3000;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_read_timeout 1h;
    }
}
