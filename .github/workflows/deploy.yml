name: Deploy

# Push-based delivery into a cluster that has no inbound internet: the runner joins the
# tailnet as an ephemeral Tailscale node and talks to the kube-apiserver over it. Public
# traffic goes the other way — Nginx Proxy Manager (external, on the tailnet) → the
# Tailscale operator proxy for the erp-web Service.
on:
  push:
    branches: [main]
  # Manual re-deploy of HEAD, and the supported way to re-converge after a failed run.
  workflow_dispatch:

# Never let two deploys interleave `kustomize edit` + `apply` against the same namespace.
# cancel-in-progress stays false: aborting mid-rollout is worse than queueing.
concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  # Cluster nodes are x86_64. Multi-arch would double build time under QEMU for no benefit.
  # VERIFIED 2026-08-08: all 34 nodes report `architecture: amd64`.
  PLATFORM: linux/amd64
  NAMESPACE: erp

jobs:
  # The full release gate — lint, typecheck, unit tests, build, integration, manifests.
  verify:
    uses: ./.github/workflows/ci.yml

  build:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        app: [api, web]
    steps:
      - uses: actions/checkout@v4

      - name: Lowercase the owner for GHCR
        id: repo
        run: echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/${{ matrix.app }}.Dockerfile
          platforms: ${{ env.PLATFORM }}
          push: true
          # `sha-<commit>` is the immutable handle the deploy job resolves to a digest.
          # `latest` is informational only — nothing deploys from it.
          tags: |
            ${{ env.REGISTRY }}/${{ steps.repo.outputs.owner }}/erp-${{ matrix.app }}:sha-${{ github.sha }}
            ${{ env.REGISTRY }}/${{ steps.repo.outputs.owner }}/erp-${{ matrix.app }}:latest
          # GitHub's own cache backend — no extra infrastructure. It evicts at 10GB; if
          # these builds start thrashing, switch to
          # type=registry,ref=<image>:buildcache.
          cache-from: type=gha,scope=erp-${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=erp-${{ matrix.app }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    # Surfaces the deploy in the Environments UI and lets required reviewers be switched on
    # later without touching this file.
    environment: production
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4

      - name: Lowercase the owner for GHCR
        id: repo
        run: echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Resolve the immutable SHA tags to digests and deploy by digest, so the rollout is
      # unaffected if a tag is ever moved.
      - name: Resolve image digests
        id: images
        run: |
          set -euo pipefail
          base="${REGISTRY}/${{ steps.repo.outputs.owner }}"
          for app in api web; do
            ref="${base}/erp-${app}:sha-${{ github.sha }}"
            digest=$(docker buildx imagetools inspect "$ref" --format '{{.Manifest.Digest}}')
            echo "${app}=${base}/erp-${app}@${digest}" >> "$GITHUB_OUTPUT"
            echo "erp-${app} -> ${digest}"
          done

      # Ephemeral node: OAuth-created nodes leave the tailnet when the runner exits, which
      # is what makes hosted runners viable here. `tag:ci` should be ACL-scoped to the
      # apiserver endpoint only — it needs nothing else on the tailnet.
      - name: Join the tailnet
        uses: tailscale/github-action@v3
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      # Installed explicitly rather than relying on whatever the runner image ships —
      # `kustomize edit` needs the standalone binary, which kubectl does not provide.
      - uses: azure/setup-kubectl@v4
      - name: Install kustomize
        run: |
          set -euo pipefail
          # The runner image ships its own kustomize, and install_kustomize.sh refuses to
          # overwrite an existing binary ("/usr/local/bin/kustomize exists. Remove it
          # first.") — it exits 1 and fails the deploy. Remove it so the pinned version
          # below is the one that actually runs, rather than whatever the image happens to
          # carry this week.
          sudo rm -f /usr/local/bin/kustomize
          curl -fsSL "https://raw.githubusercontent.com/kubernetes-sigs/kustomize/master/hack/install_kustomize.sh" \
            | bash -s 5.4.3 /usr/local/bin
          kustomize version

      - name: Configure kubectl
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.kube"
          echo "${{ secrets.KUBE_CONFIG }}" | base64 -d > "$HOME/.kube/config"
          chmod 600 "$HOME/.kube/config"
          kubectl version --output=yaml --request-timeout=30s | head -20

      # Rendered every run, so rotating a GitHub secret takes effect on the next deploy.
      # Values reach the cluster over kubectl stdin — never through the job log.
      - name: Render secrets
        run: |
          set -euo pipefail
          kubectl create namespace "$NAMESPACE" --dry-run=client -o yaml | kubectl apply -f -

          # DATABASE_URL/REDIS_URL are composed here so the Postgres password has exactly
          # one source of truth (PROD_POSTGRES_PASSWORD).
          literals=(
            --from-literal=DATABASE_URL="postgres://erp:${{ secrets.PROD_POSTGRES_PASSWORD }}@erp-postgres:5432/erp"
            --from-literal=REDIS_URL="redis://erp-redis:6379/0"
            --from-literal=POSTGRES_PASSWORD="${{ secrets.PROD_POSTGRES_PASSWORD }}"
            --from-literal=JWT_ACCESS_SECRET="${{ secrets.PROD_JWT_ACCESS_SECRET }}"
            --from-literal=JWT_REFRESH_SECRET="${{ secrets.PROD_JWT_REFRESH_SECRET }}"
            --from-literal=ENCRYPTION_KEY="${{ secrets.PROD_ENCRYPTION_KEY }}"
            --from-literal=S3_ACCESS_KEY="${{ secrets.PROD_S3_ACCESS_KEY }}"
            --from-literal=S3_SECRET_KEY="${{ secrets.PROD_S3_SECRET_KEY }}"
            --from-literal=MINIO_ROOT_USER="${{ secrets.PROD_MINIO_ROOT_USER }}"
            --from-literal=MINIO_ROOT_PASSWORD="${{ secrets.PROD_MINIO_ROOT_PASSWORD }}"
          )

          # SMTP is optional — mail degrades to in-app alerts without it. Adding these keys
          # unconditionally set them to "" when the GitHub secret is unset, and the env
          # schema's `z.string().min(1).optional()` permits the key being ABSENT, not empty:
          # every api and worker pod died at boot on "SMTP_USER: String must contain at
          # least 1 character(s)". Only pass them when they actually carry a value.
          if [ -n "${{ secrets.PROD_SMTP_USER }}" ]; then
            literals+=(--from-literal=SMTP_USER="${{ secrets.PROD_SMTP_USER }}")
          fi
          if [ -n "${{ secrets.PROD_SMTP_PASS }}" ]; then
            literals+=(--from-literal=SMTP_PASS="${{ secrets.PROD_SMTP_PASS }}")
          fi

          kubectl create secret generic erp-secrets \
            --namespace "$NAMESPACE" \
            "${literals[@]}" \
            --dry-run=client -o yaml | kubectl apply -f -

          kubectl create secret docker-registry ghcr-pull \
            --namespace "$NAMESPACE" \
            --docker-server="$REGISTRY" \
            --docker-username="${{ steps.repo.outputs.owner }}" \
            --docker-password="${{ secrets.GHCR_PULL_TOKEN }}" \
            --dry-run=client -o yaml | kubectl apply -f -

      # Breaks a first-deploy deadlock: the migration Job below needs things that only
      # "Apply manifests" creates, further down. Against an empty namespace it failed twice
      # over — first on a database that did not exist, then on `serviceaccount "erp-app" not
      # found` (the Job runs as that SA, and the SA carries the ghcr-pull secret its image
      # needs). The Job cannot even create a pod, so it hangs until the wait below times out.
      #
      # The invariant worth protecting is narrow: no *app pod* may roll before migrations
      # pass. Everything else — namespace, ServiceAccount, ConfigMap, Services, the data
      # tier — is inert infrastructure that is safe, and necessary, to create first. So this
      # applies everything NOT labelled `app.kubernetes.io/component: app`, which is exactly
      # the three Deployments and their PDBs. Note `!=` also matches objects that lack the
      # label entirely, which is what pulls in the ServiceAccount and ConfigMap.
      #
      # On every deploy after the first this is a no-op re-apply of unchanged objects.
      - name: Bootstrap prerequisites
        run: |
          set -euo pipefail
          cd infra/k8s/overlays/prod
          kubectl kustomize . \
            | kubectl apply -f - --selector 'app.kubernetes.io/component!=app'
          # StatefulSet rollout status blocks until the pod is Ready, which for Postgres
          # means `pg_isready` passes — so the migration below has a live server to talk to.
          kubectl -n "$NAMESPACE" rollout status sts/erp-postgres --timeout=300s

      # Runs BEFORE any Deployment changes. On failure the old pods are still serving and
      # the job exits non-zero without touching them.
      - name: Apply database migrations
        run: |
          set -euo pipefail
          job="erp-migrate-${{ github.sha }}"
          sed -e "s|__IMAGE__|${{ steps.images.outputs.api }}|g" \
              -e "s|__TAG__|${{ github.sha }}|g" \
              infra/k8s/jobs/migrate-job.yaml | kubectl apply -f -

          if ! kubectl -n "$NAMESPACE" wait --for=condition=complete "job/$job" --timeout=300s; then
            echo "::error::migration job did not complete — aborting before rollout"
            kubectl -n "$NAMESPACE" describe "job/$job" || true
            kubectl -n "$NAMESPACE" logs "job/$job" --tail=200 || true
            exit 1
          fi
          kubectl -n "$NAMESPACE" logs "job/$job" --tail=50

      - name: Apply manifests
        run: |
          set -euo pipefail
          cd infra/k8s/overlays/prod
          # The left-hand side is the image name as written in the manifests (the literal
          # `OWNER` placeholder), NOT the resolved owner — that is the key kustomize
          # matches on. Runner-local edit only; never committed.
          kustomize edit set image \
            "ghcr.io/OWNER/erp-api=${{ steps.images.outputs.api }}" \
            "ghcr.io/OWNER/erp-web=${{ steps.images.outputs.web }}"
          kubectl kustomize . | kubectl apply -f -

      # `kubectl apply` never deletes. A resource removed from the base just lingers in the
      # cluster — still enforced, no longer in git. Not theoretical: default-deny-ingress and
      # allow-web-from-tailscale-proxy were removed from the base on 2026-08-16 and went on
      # dropping every public request to erp-web for the next 13 days, because nothing ever
      # deleted the live objects. Diagnosed 2026-08-29; see infra/k8s/base/networkpolicy.yaml.
      #
      # This REPORTS drift, it does not prune it. `kubectl apply --prune -l
      # app.kubernetes.io/part-of=erp` is not a safe substitute: the StatefulSet volumes
      # (data-erp-postgres-0, data-erp-redis-0, data-erp-minio-0) inherit that label but are
      # rendered inside volumeClaimTemplates rather than as standalone objects, so prune reads
      # the production database volume as an orphan and deletes it. Verified 2026-08-29.
      - name: Report resources in the cluster but not in git
        run: |
          set -euo pipefail
          cd infra/k8s/overlays/prod
          kubectl kustomize . > /tmp/rendered.yaml
          # kubectl's output is normalised: `kind:` and `metadata:` at column 0, `  name:`
          # first inside metadata. That is enough structure to key on without a YAML parser.
          awk '
            /^kind:/     { kind = $2; next }
            /^metadata:/ { inmeta = 1; next }
            inmeta && /^  name:/ { print tolower(kind) "/" $2; inmeta = 0; next }
            /^[^ ]/      { inmeta = 0 }
          ' /tmp/rendered.yaml | sort -u > /tmp/rendered-keys.txt

          # Deliberately excludes persistentvolumeclaim (see above) and secret (created out
          # of band by the steps further up, never rendered by kustomize).
          : > /tmp/orphans.txt
          for k in networkpolicy service deployment statefulset configmap \
                   poddisruptionbudget serviceaccount; do
            for res in $(kubectl -n "$NAMESPACE" get "$k" \
                           -l app.kubernetes.io/part-of=erp \
                           -o name --ignore-not-found); do
              name="${res##*/}"
              grep -qx "$k/$name" /tmp/rendered-keys.txt || echo "$k/$name" >> /tmp/orphans.txt
            done
          done

          if [ -s /tmp/orphans.txt ]; then
            echo "::warning::live in $NAMESPACE but absent from the rendered manifests — delete explicitly if unwanted"
            sed 's/^/  orphan: /' /tmp/orphans.txt
            echo "  remove with: kubectl -n $NAMESPACE delete <kind>/<name>"
          else
            echo "no drift: every labelled resource in $NAMESPACE is present in the manifests"
          fi

      # api first: its env schema is zod-validated fail-fast, so a bad config or secret
      # surfaces here as a CrashLoopBackOff before web is touched.
      - name: Wait for rollout
        run: |
          set -euo pipefail
          for d in erp-api erp-worker erp-web; do
            kubectl -n "$NAMESPACE" rollout status "deploy/$d" --timeout=300s
          done

      # Exercises the real request path (nginx SPA container → erp-api Service) from inside
      # the cluster, using busybox wget already present in the web image — no extra pull.
      - name: Smoke test
        run: |
          set -euo pipefail
          # 127.0.0.1, not `localhost`: busybox resolves `localhost` to ::1 first and
          # nginx-unprivileged listens on IPv4 only, so the hostname form fails with
          # "can't connect to remote host: Connection refused" even when the whole stack is
          # healthy. Verified in-cluster — 127.0.0.1:8080/api/v1/health returns
          # {"status":"ok"} at the same moment localhost:8080 is refused.
          kubectl -n "$NAMESPACE" exec deploy/erp-web -- \
            wget -qO- --timeout=10 http://127.0.0.1:8080/api/v1/health

      # The step above proves web -> api from INSIDE the pod. It says nothing about whether a
      # human can reach the site: Nginx Proxy Manager -> Tailscale proxy -> erp-web all sits
      # outside it. A default-deny NetworkPolicy severed exactly that hop twice while this
      # deploy stayed green, which is how the breakage survived a "successful" release. Hit
      # the real public URL, the way a user does.
      #
      # Failing here triggers the rollback below. That will not repair an ingress-layer fault
      # on its own — but the whole point is that the deploy must not report success while the
      # site is unreachable.
      - name: Smoke test public ingress
        run: |
          set -euo pipefail
          url=https://garment-erp.keenlab.io/
          code=000
          for attempt in 1 2 3 4 5; do
            code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 20 "$url" || echo 000)
            if [ "$code" = "200" ]; then
              echo "$url -> $code"
              exit 0
            fi
            echo "attempt $attempt: $url -> $code"
            sleep 10
          done
          echo "::error::$url is not serving (last status $code) — rollout finished but the site is unreachable"
          exit 1

      - name: Roll back on failure
        if: failure()
        run: |
          echo "::error::deploy failed — rolling back"
          for d in erp-api erp-worker erp-web; do
            kubectl -n "$NAMESPACE" rollout undo "deploy/$d" || true
          done
          kubectl -n "$NAMESPACE" get pods -o wide || true
          kubectl -n "$NAMESPACE" get events --sort-by=.lastTimestamp | tail -40 || true
          # NOTE: `rollout undo` does NOT revert the migration. That is safe only because
          # migrations must be backward-compatible (expand -> contract); see
          # infra/k8s/README.md.
