name: CI

on:
  pull_request:
  # Called by deploy.yml on pushes to main, so a merge runs this suite exactly once as the
  # release gate rather than twice (here and there).
  workflow_call:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # needed for affected diff vs origin/main

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Affected-only on PRs: build/test only what changed vs main (spec §10.1). The `test`
      # task runs the unit vitest suite; integration specs self-skip here (no
      # DATABASE_URL_TEST) and run in the dedicated `integration` job below.
      # `@erp/e2e` is excluded: its `test` script is Playwright, which needs the full
      # running stack (web+api+browsers) — it belongs in a dedicated e2e job, not this
      # stack-less unit verify job (see e2e/README.md §CI).
      #
      # On main the affected filter is useless — `...[origin/main]` diffs main against
      # itself and selects nothing — so the release gate verifies the whole workspace.
      - name: Verify
        run: |
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            pnpm turbo run lint typecheck test build --filter=!@erp/e2e
          else
            pnpm turbo run lint typecheck test build --filter=...[origin/main] --filter=!@erp/e2e
          fi

      # --- Turborepo remote cache (disabled — MR-Q1, local cache only for now) ---
      # To enable later, set repo/org secrets and uncomment:
      # env:
      #   TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      #   TURBO_TEAM: ${{ vars.TURBO_TEAM }}

  # Integration tests boot a throwaway Postgres via Testcontainers (Docker is
  # available on ubuntu-latest — no `services:` block needed), apply the committed
  # migrations, and exercise sequence concurrency + audit append-only against it.
  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Build @erp/api's workspace deps (@erp/db, @erp/contracts, @erp/utils, …) so
      # the specs resolve their compiled output.
      - run: pnpm --filter "@erp/api..." build

      - run: pnpm --filter @erp/api test:integration

  # Renders the Kustomize overlay so a broken manifest fails on the PR rather than at
  # deploy time, when the tailnet session and half a rollout are already in flight.
  manifests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-kubectl@v4
      - name: Render prod overlay
        run: kubectl kustomize infra/k8s/overlays/prod > /dev/null
