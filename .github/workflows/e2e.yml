name: E2E

# Browser-level UI tests (docs/testing/UI_TEST_PLAN.md §8). Deliberately its OWN workflow
# rather than a job inside ci.yml: `deploy.yml` calls ci.yml as the production release gate,
# so anything added there gates deploys. This suite is young, drives a real browser against a
# real stack, and will find its flakiness the expensive way — keep it off the deploy path
# until it has proven stable.
#
# GATE POLICY: this reports true pass/fail (no `continue-on-error` — a hidden failure is worse
# than a red check), but it is NOT yet a required check. Promote it in branch protection once
# it has been green across a few dozen PRs, then consider folding it into ci.yml.
#
# Runs on PRs *and* on pushes to main. The push trigger matters because merges here often go
# straight to main with no PR — a pull_request-only workflow would then almost never fire. It
# still does not gate the deploy: this is a separate workflow, so `deploy.yml` proceeds
# independently and a red E2E is a signal to act on, not a blocked rollout.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# One e2e run per branch: they all bind the same host ports (5432/6379/9000/3000/5173) and a
# second concurrent run on the same runner would collide.
concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    # The api fail-fasts on a bad env at boot (config/env.schema.ts), so every required var is
    # set here. Hosts are `localhost` because infra/docker-compose.yml publishes the ports —
    # that file is the outside-the-container topology (the devcontainer reaches the same
    # services by service name instead).
    env:
      DATABASE_URL: postgres://erp:erp@localhost:5432/erp
      REDIS_URL: redis://localhost:6379
      S3_ENDPOINT: http://localhost:9000
      S3_REGION: us-east-1
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin
      S3_BUCKET: erp-dev
      S3_FORCE_PATH_STYLE: "true"
      JWT_ACCESS_SECRET: ci-access-secret-not-a-real-key
      JWT_REFRESH_SECRET: ci-refresh-secret-not-a-real-key
      # 32-byte AES-256-GCM key (64 hex chars) — CI-only throwaway, never a deployed value.
      ENCRYPTION_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # `dev` does NOT declare `dependsOn: ["^build"]` (turbo.json), so the workspace packages
      # must be built first or the apps resolve a stale/absent dist: a stale @erp/ui leaves the
      # web app a blank page, a stale @erp/db/@erp/contracts stops the api booting at all.
      - name: Build workspace packages
        run: pnpm build

      - name: Start infra (Postgres, Redis, MinIO)
        run: docker compose -f infra/docker-compose.yml up -d --wait

      # Schema + the super-admin, the UI_TEST_PLAN §4 personas, and the sales/inventory master
      # data the golden paths select. No Admin-UI bootstrap step is needed — the seed creates
      # every persona login the specs use.
      - name: Migrate and seed
        # SEED_TEST_DATA is what creates the §4 personas and the sales/inventory master data.
        # It is OFF by default so the production bootstrap documented in infra/k8s/README.md
        # step 6 stays bootstrap-only (it runs this same seed file, and must never create ten
        # accounts sharing the password `changeme`). Without the flag every persona login and
        # every golden-path spec here would fail.
        env:
          SEED_TEST_DATA: "1"
        run: pnpm db:migrate && pnpm db:seed

      - name: Install Playwright browser
        run: pnpm --filter @erp/e2e exec playwright install --with-deps chromium

      # Start the two servers SEPARATELY rather than via `pnpm dev`. Two reasons, both learned
      # the hard way on this workflow's first run (api never came up, and the log was empty):
      #
      #  1. turbo BUFFERS task output in non-TTY mode and persistent tasks never finish, so a
      #     `pnpm dev` log captures nothing past the banner — the failure was undiagnosable.
      #  2. `pnpm dev` starts a `dev` task in every package (9 of them, incl. tsc/ui watchers)
      #     which all compete for the runner's 2 cores.
      #
      # The api runs BUILT (`node dist/main.js`, via its `start` script — the same entrypoint
      # infra/docker/api.Dockerfile uses) instead of `nest start --watch`: no watch-mode
      # type-check of the whole project at boot, and it matches what actually ships.
      # The web app must stay Vite DEV — its `/api` proxy is configured under `server` only,
      # so `vite preview` would serve the bundle with no API behind it.
      - name: Start the api (built)
        run: |
          nohup pnpm --filter @erp/api start > /tmp/api.log 2>&1 &
          echo "api pid $!"

      - name: Start the web dev server
        run: |
          nohup pnpm --filter @erp/web dev > /tmp/web.log 2>&1 &
          echo "web pid $!"

      # The `storybook` Playwright project drives the TC-CMP component cases against :6006.
      # Without this they fail as "connection refused" — the specs need no backend, only this.
      - name: Start Storybook
        run: |
          nohup pnpm --filter @erp/ui storybook > /tmp/storybook.log 2>&1 &
          echo "storybook pid $!"

      - name: Wait for api, web and storybook
        run: |
          for i in $(seq 1 60); do
            api=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:3000/api/v1/health || true)
            web=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:5173/ || true)
            sb=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:6006/ || true)
            if [ "$api" = "200" ] && [ "$web" = "200" ] && [ "$sb" = "200" ]; then
              echo "stack ready after ~$((i * 5))s"
              exit 0
            fi
            if [ $((i % 6)) -eq 0 ]; then
              echo "waiting… api=$api web=$web storybook=$sb ($((i * 5))s elapsed)"
            fi
            sleep 5
          done
          # Dump the logs INLINE, not just as an artifact: the first failure of this workflow
          # cost a download round-trip to learn nothing, because the log was empty.
          echo "::error::stack did not come up (api=$api web=$web storybook=$sb)"
          echo "----- api.log (tail) -----"; tail -n 120 /tmp/api.log || true
          echo "----- web.log (tail) -----"; tail -n 60 /tmp/web.log || true
          echo "----- storybook.log (tail) -----"; tail -n 60 /tmp/storybook.log || true
          exit 1

      # playwright.config.ts already adapts to CI (forbidOnly, retries, 2 workers). Runs both
      # projects: `app` against :5173 and `storybook` (the TC-CMP component cases) against :6006.
      - name: Run the suite
        run: pnpm --filter @erp/e2e test

      # The HTML report is the run artifact; traces/screenshots land in test-results/ on
      # failure, and the dev log is what turns "a request 500'd" into a stack trace.
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: e2e/playwright-report/
          retention-days: 14

      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-failure-artifacts
          path: |
            e2e/test-results/
            /tmp/api.log
            /tmp/web.log
            /tmp/storybook.log
          retention-days: 14
